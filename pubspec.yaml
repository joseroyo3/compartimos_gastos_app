name: compartimos_gastos
description: "Compartimos Gastos App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Dependencias que la app USA cuando está funcionando
  firebase_core: ^3.1.1
  firebase_auth: ^5.3.3
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  cloud_firestore: ^5.6.2
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^6.1.0
  sign_in_with_apple: ^6.1.1
  font_awesome_flutter: ^10.7.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Herramienta de desarrollo
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/logo/
    - lib/assets/images/login_hero.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  min_sdk_android: 21

  image_path: "lib/assets/images/logo/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/assets/images/logo/logo.png"